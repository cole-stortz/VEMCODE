name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + build tools
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev cmake g++

      - name: Configure
        run: cmake -B build -S .

      - name: Run test suite
        run: ./scripts/run_tests.sh

      - name: Run example suite
        run: ./scripts/run_examples.sh
